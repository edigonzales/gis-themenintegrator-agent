        coalesceMultiLine = project.schemaProperties.getProperty('coalesceMultiLine').toBoolean()
    if (project.schemaProperties.getProperty('coalesceArray'))
        coalesceArray = project.schemaProperties.getProperty('coalesceArray').toBoolean()
    if (project.schemaProperties.getProperty('coalesceJson'))
        coalesceJson = project.schemaProperties.getProperty('coalesceJson').toBoolean()
    if (project.schemaProperties.getProperty('expandStruct'))
        expandStruct = project.schemaProperties.getProperty('expandStruct').toBoolean()
    if (project.schemaProperties.getProperty('sqlColsAsText'))
        sqlColsAsText = project.schemaProperties.getProperty('sqlColsAsText').toBoolean()
    if (project.schemaProperties.getProperty('sqlExtRefCols'))
        sqlExtRefCols = project.schemaProperties.getProperty('sqlExtRefCols').toBoolean()
    if (project.schemaProperties.getProperty('iliMetaAttrs'))
        iliMetaAttrs = project(':schema-tasks-topic').file(project.schemaProperties.getProperty('iliMetaAttrs')).path
    if (project.schemaProperties.getProperty('modeldir'))
        modeldir = project.schemaProperties.getProperty('modeldir')
    if (project.schemaProperties.getProperty('sqlEnableNull'))
        sqlEnableNull = project.schemaProperties.getProperty('sqlEnableNull').toBoolean()
}

task configureSchemaShared(type: SqlExecutor) {
    // Set the comment for the schema to empty string if not set
    def schemaComment = project.schemaProperties.getProperty('schemaComment') ?: ''

    // Create a FileCollection containing the SQL scripts to execute
    // And for backwards compatibility, create an additional ArrayList containing the same SQL scripts
    // The comment_on_schema.sql script is always executed
    def sqlScriptsCollection = files('comment_on_schema.sql')
    def sqlScriptsList = ['comment_on_schema.sql']
    // If any of the following files exists in the topic folder,
    // add it to the FileCollection of SQL scripts to execute
    // And add it to the backwards compatibility ArrayList of SQL scripts to execute
    def additionalSqlFileNames = ['create_views.sql', 'postscript.sql', 'stdcols.sql']
    for ( additionalSqlFileName in additionalSqlFileNames) {
        def additionalSqlFile = project(':schema-tasks-topic').file(additionalSqlFileName)
        if (additionalSqlFile.exists()) {
            sqlScriptsCollection += files(additionalSqlFile)
            sqlScriptsList.add(additionalSqlFile.getPath())
        }
    }

    group = 'Configure schema'
    description = 'Set comment on schema'
    doLast {
        println "DB schema ${project.schemaName} configured"
    }
    // Run grantDevelopmentPrivileges task afterwards if in a development environment
    finalizedBy {
        if (gretlEnvironment == 'development' || gretlEnvironment == 'dev') {
            return ':development-tasks-shared:grantDevelopmentPrivileges'
        }
    }
    database = [project.dbUri, project.dbUser, project.dbPwd]
    sqlFiles = jobProperties.getProperty('nodeLabel') != project.apiBreakNodeLabel ? sqlScriptsList : sqlScriptsCollection
    sqlParameters = [dbSchema: project.schemaName, dbSchemaComment: "'" + schemaComment + "'"]
}
